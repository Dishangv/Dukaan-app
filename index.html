<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f"><meta name="description" content="DUKAAN by DEV AUTOMOBILES - Offline shop management">
<link rel="manifest" href="manifest.webmanifest">
<title>DUKAAN — by DEV AUTOMOBILES</title>
<style>
:root{--bg:#07130f;--panel:#10221b;--panel2:#142b22;--line:#254536;--text:#eef8f1;--muted:#9bb6a5;--green:#27d18b;--gold:#d8bd78;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#07130f,#0a1b15 55%,#08110e);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px 18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07130fee;backdrop-filter:blur(12px);z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#2be29a,#08764b);display:grid;place-items:center;color:#052014;font-weight:900;font-size:20px;box-shadow:0 8px 24px #0b9d6233}
h1{font-size:21px;letter-spacing:2px;margin:0}.sub{font-size:11px;color:var(--gold);letter-spacing:1.6px;margin-top:3px}
main{max-width:850px;margin:auto;padding:18px 14px 100px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:700;margin:6px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 10px 25px #0002}
.metric small{color:var(--muted);display:block}.metric strong{display:block;font-size:24px;margin-top:8px}.metric span{color:var(--green);font-size:11px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.btn{border:1px solid var(--line);background:#142b22;color:var(--text);padding:13px 12px;border-radius:13px;font-weight:650;text-align:center;cursor:pointer}.btn.primary{background:var(--green);color:#052014;border:0}.btn.gold{border-color:#76643d;color:var(--gold)}
nav{position:fixed;bottom:0;left:0;right:0;background:#08150ff2;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:5px;min-width:58px}nav button b{display:block;font-size:19px;margin-bottom:2px}nav button.active{color:var(--green)}
h2{font-size:18px;margin:5px 0 14px}.section{margin-top:20px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #25453688}.row:last-child{border:0}
input,select{width:100%;background:#081710;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);margin:5px 0 12px;font:inherit}label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}
.itemtitle{font-weight:700}.muted{color:var(--muted);font-size:12px}.amount{color:var(--green);font-weight:750}.danger{color:var(--red)}.empty{color:var(--muted);text-align:center;padding:24px 8px}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#d9f8e8;color:#082015;padding:11px 16px;border-radius:30px;display:none;z-index:20;font-weight:650}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="brand"><div class="logo">D</div><div><h1>DUKAAN</h1><div class="sub">BY DEV AUTOMOBILES</div></div></div></header>
<main id="app"></main><div class="toast" id="toast"></div>
<nav>
<button class="active" data-page="home"><b>⌂</b>Home</button><button data-page="stock"><b>▤</b>Stock</button><button data-page="sale"><b>＋</b>Sale</button><button data-page="khata"><b>₹</b>Khata</button><button data-page="reports"><b>▥</b>Reports</button>
</nav>
<script>
const KEY='dukaan_v2_data';
let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[],"sales":[],"khata":[],"expenses":[]}');
let page='home';
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const toast=t=>{let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)};
const el=document.getElementById('app');
function nav(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function shell(title,body){el.innerHTML=`<div class="eyebrow">SHOP MANAGEMENT • OFFLINE FIRST</div><h2>${title}</h2>${body}`}
function render(){
 if(page==='home'){
 let today=new Date().toISOString().slice(0,10),sales=db.sales.filter(s=>s.date===today),rev=sales.reduce((a,s)=>a+s.total,0),profit=sales.reduce((a,s)=>a+s.profit,0),stock=db.products.reduce((a,p)=>a+p.qty*p.cost,0),due=db.khata.reduce((a,k)=>a+k.due,0);
 shell('Good day 👋',`<div class="grid">
 <div class="card metric"><small>Today's Sales</small><strong>${money(rev)}</strong><span>${sales.length} invoices</span></div>
 <div class="card metric"><small>Today's Gross Profit</small><strong>${money(profit)}</strong><span>From recorded sales</span></div>
 <div class="card metric"><small>Stock Value</small><strong>${money(stock)}</strong><span>${db.products.length} products</span></div>
 <div class="card metric"><small>Customer Due</small><strong>${money(due)}</strong><span>Outstanding khata</span></div></div>
 <div class="section"><div class="eyebrow">QUICK ACTIONS</div><div class="actions"><button class="btn primary" onclick="nav('sale')">＋ New Sale</button><button class="btn" onclick="nav('stock')">＋ Add Product</button><button class="btn" onclick="nav('khata')">₹ Customer Khata</button><button class="btn gold" onclick="nav('reports')">View Reports</button></div></div>
 <div class="card section"><div class="row"><b>Recent Sales</b><span class="muted">Latest entries</span></div>${db.sales.slice(-4).reverse().map(s=>`<div class="row"><div><div class="itemtitle">${esc(s.customer||'Walk-in customer')}</div><div class="muted">${s.date} • ${s.items} item(s)</div></div><b class="amount">${money(s.total)}</b></div>`).join('')||'<div class="empty">No sales recorded yet.</div>'}</div>
 <div class="muted section">Your entries are stored on this device. Export a backup regularly.</div>`);
 } else if(page==='stock'){
 shell('Inventory & Stock',`<div class="card"><h2>Add Product</h2><form id="productForm"><div class="formgrid">
 <div class="wide"><label>Product name</label><input name="name" required placeholder="e.g. Oil Filter"></div>
 <div><label>Part number / SKU</label><input name="sku" placeholder="e.g. LF3959"></div><div><label>Brand</label><input name="brand" placeholder="Fleetguard"></div>
 <div><label>Purchase cost (₹)</label><input name="cost" type="number" min="0" step="0.01" required></div><div><label>Selling price (₹)</label><input name="price" type="number" min="0" step="0.01" required></div>
 <div><label>Opening quantity</label><input name="qty" type="number" min="0" step="1" required></div><div><label>Low stock at</label><input name="low" type="number" min="0" value="3"></div></div><button class="btn primary" style="width:100%">Save Product</button></form></div>
 <div class="section card"><div class="row"><b>Products (${db.products.length})</b><input id="search" placeholder="Search name / part no." style="max-width:180px;margin:0"></div><div id="products">${productRows()}</div></div>`);
 document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=Object.fromEntries(f);db.products.push({id:Date.now(),name:p.name,sku:p.sku,brand:p.brand,cost:+p.cost,price:+p.price,qty:+p.qty,low:+p.low});save();render();toast('Product saved')};
 document.getElementById('search').oninput=e=>{document.getElementById('products').innerHTML=productRows(e.target.value)};
 } else if(page==='sale'){
 shell('New Sale',`<div class="card"><form id="saleForm"><label>Customer name</label><input name="customer" placeholder="Walk-in customer">
 <label>Product</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} ${p.sku?'• '+esc(p.sku):''} (Stock: ${p.qty})</option>`).join('')}</select>
 <div class="formgrid"><div><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div><div><label>Unit price (₹)</label><input name="price" type="number" min="0" step=".01" required></div></div>
 <label>Payment received (₹)</label><input name="paid" type="number" min="0" step=".01" value="0"><button class="btn primary" style="width:100%">Save Sale</button></form></div>
 <div class="muted section">Sale save karte hi stock quantity automatically reduce hogi. Add products in Stock first.</div>
 <div class="card section"><b>Recent invoices</b>${db.sales.slice(-8).reverse().map(s=>`<div class="row"><span>${esc(s.customer||'Walk-in')}<div class="muted">${s.date}</div></span><b class="amount">${money(s.total)}</b></div>`).join('')||'<div class="empty">No sales yet.</div>'}</div>`);
 let form=document.getElementById('saleForm');form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),p=db.products.find(x=>x.id==f.get('product')),q=+f.get('qty');if(!p){toast('Pehle stock mein product add karein');return}if(q>p.qty){toast('Insufficient stock');return}let price=+f.get('price')||p.price,total=price*q,paid=+f.get('paid'),profit=(price-p.cost)*q;p.qty-=q;db.sales.push({id:Date.now(),customer:f.get('customer'),date:new Date().toISOString().slice(0,10),items:1,total,paid,due:Math.max(0,total-paid),profit,product:p.name,qty:q});if(total>paid&&f.get('customer'))db.khata.push({id:Date.now()+1,name:f.get('customer'),due:total-paid,note:'Sale'});save();render();toast('Sale saved • Stock updated')};
 } else if(page==='khata'){
 shell('Customer Khata',`<div class="card"><form id="khataForm"><label>Customer name</label><input name="name" required><div class="formgrid"><div><label>Amount due (₹)</label><input name="due" type="number" min="0" step=".01" required></div><div><label>Note</label><input name="note" placeholder="Previous balance"></div></div><button class="btn primary" style="width:100%">Add Due</button></form></div><div class="card section"><b>Outstanding balances</b>${db.khata.map(k=>`<div class="row"><span>${esc(k.name)}<div class="muted">${esc(k.note||'')}</div></span><b class="amount">${money(k.due)}</b></div>`).join('')||'<div class="empty">No pending khata.</div>'}</div>`);
 document.getElementById('khataForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.khata.push({id:Date.now(),name:f.get('name'),due:+f.get('due'),note:f.get('note')});save();render();toast('Khata entry saved')};
 } else {
 let rev=db.sales.reduce((a,s)=>a+s.total,0),cost=rev-db.sales.reduce((a,s)=>a+s.profit,0),profit=db.sales.reduce((a,s)=>a+s.profit,0);
 shell('Business Reports',`<div class="grid"><div class="card metric"><small>Total Sales</small><strong>${money(rev)}</strong></div><div class="card metric"><small>Gross Profit</small><strong>${money(profit)}</strong></div><div class="card metric"><small>Estimated Cost</small><strong>${money(cost)}</strong></div><div class="card metric"><small>Invoices</small><strong>${db.sales.length}</strong></div></div>
 <div class="actions"><button class="btn primary" onclick="exportData()">Export Backup</button><button class="btn" onclick="document.getElementById('restore').click()">Restore Backup</button><button class="btn gold" onclick="window.print()">Print Report</button><button class="btn danger" onclick="clearData()">Clear All Data</button></div>
 <input id="restore" type="file" accept="application/json" hidden>
 <div class="card muted">Backup JSON file ko safe jagah rakhein. Data is stored locally in this browser/app on this device. This is a starter business ledger, not a tax-certified accounting system.</div>`);
 document.getElementById('restore').onchange=async e=>{try{db=JSON.parse(await e.target.files[0].text());save();render();toast('Backup restored')}catch{toast('Invalid backup file')}};
 }
}
function productRows(q=''){let arr=db.products.filter(p=>(p.name+' '+p.sku+' '+p.brand).toLowerCase().includes(q.toLowerCase()));return arr.map(p=>`<div class="row"><div><div class="itemtitle">${esc(p.name)}</div><div class="muted">${esc(p.brand)} • ${esc(p.sku)}</div><div class="muted">Cost ${money(p.cost)} / Sell ${money(p.price)}</div></div><div style="text-align:right"><b class="${p.qty<=p.low?'danger':'amount'}">${p.qty} pcs</b><div class="muted">${p.qty<=p.low?'Low stock':'In stock'}</div></div></div>`).join('')||'<div class="empty">No products found.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='dukaan-backup.json';a.click();URL.revokeObjectURL(u)}
function clearData(){if(confirm('Delete all DUKAAN data from this device? Export backup first.')){db={products:[],sales:[],khata:[],expenses:[]};save();render();toast('Data cleared')}}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
